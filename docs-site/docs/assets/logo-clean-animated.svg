<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" width="100%" height="100%">
  <style>
    .char-body { transform-origin: 460px 490px; animation: charBreathe 3.2s ease-in-out infinite; }
    .char-horn { transform-origin: 635px 295px; animation: hornTwitch 3.2s ease-in-out infinite; }
    .char-tail-pivot { transform-origin: 252px 588px; animation: tailWagPivot 2.1s ease-in-out infinite; }
    .char-needle { transform-origin: 730px 630px; animation: needleBob 2.6s ease-in-out infinite; }
    @keyframes charBreathe {
      0%, 100% { transform: translateY(0px) scale(1, 1) rotate(0deg); }
      50% { transform: translateY(-7px) scale(1.015, 0.988) rotate(-0.8deg); }
    }
    @keyframes hornTwitch {
      0%, 65%, 100% { transform: rotate(0deg) translateY(0px); }
      74% { transform: rotate(9deg) translateY(-4px); }
      82% { transform: rotate(-5deg) translateY(1px); }
      90% { transform: rotate(6deg) translateY(-2px); }
    }
    @keyframes tailWagPivot {
      0%, 100% { transform: rotate(0deg); }
      25% { transform: rotate(-7.5deg) translateY(-4px); }
      50% { transform: rotate(1.5deg); }
      75% { transform: rotate(6.8deg) translateY(4px); }
    }
    @keyframes needleBob {
      0%, 100% { transform: translate(0px, 0px) rotate(0deg); }
      50% { transform: translate(-6px, -11px) rotate(-4.5deg); }
    }
  </style>
  <g fill="#70D5C5" fill-rule="evenodd">
    <g class="char-body">
      <path d="M 302 334 C 242 295, 248 212, 322 176 C 346 164, 358 172, 353 194 C 344 232, 356 266, 386 277 C 468 258, 568 268, 638 324 C 716 386, 732 504, 676 598 C 618 692, 488 712, 344 702 C 286 698, 254 684, 258 652 L 302 334 Z M 432 365 L 394 631 C 506 641, 594 598, 596 498 C 598 398, 522 356, 432 365 Z M 337.1 379.7 A 11.5 11.5 0 0 1 359.9 383.0 L 350.9 444.3 A 11.5 11.5 0 0 1 328.1 441.0 Z M 322.1 487.7 A 11.5 11.5 0 0 1 344.9 491.0 L 335.9 552.3 A 11.5 11.5 0 0 1 313.1 549.0 Z M 306.1 595.7 A 11.5 11.5 0 0 1 328.9 599.0 L 319.9 660.3 A 11.5 11.5 0 0 1 297.1 657.0 Z" />
    </g>
    <g class="char-horn">
      <path d="M 614 273 C 628 252, 633 234, 631 215 C 629 198, 646 196, 661 211 C 690 240, 700 286, 684 323 C 665 301, 642 284, 614 273 Z" />
    </g>
    <g class="char-tail-pivot">
      <path d="M 252 572 L 247 604 C 210 615, 192 634, 195 656 C 201 702, 314 734, 444 726 C 554 719, 636 680, 684 636 C 678 656, 646 694, 596 720 C 482 801, 292 810, 192 745.2 C 122 698.6, 136 598, 252 572 Z" />
    </g>
    <g class="char-needle">
      <path d="M 603 811 C 600 816, 606 821, 611 815 L 780 594 C 804 576, 829 556, 847 526 C 868 491, 862 456, 840 444 C 816 431, 782 448, 760 485 C 742 515, 735 544, 731 571 L 603 811 Z M 825 475 C 835 482, 827 507, 810 530 C 793 553, 773 566, 763 559 C 753 552, 761 527, 778 504 C 795 481, 815 468, 825 475 Z" transform="rotate(3 730 630)" />
    </g>
  </g>
</svg>
