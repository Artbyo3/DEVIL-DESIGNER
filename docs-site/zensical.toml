[project]
site_url = "https://artbyo3.github.io/DEVIL-DESIGNER/"
site_name = "Devil Designer"
site_description = "A movable 2D clothing-pattern editor and cloth authoring tool for Blender."
site_author = "Artbyo3"
extra_css = ["stylesheets/extra.css", "stylesheets/landing.css", "stylesheets/guides.css"]

nav = [
  { "Install" = "install.md" },
  { "Quickstart" = "quickstart.md" },
  { "Draft" = "draft.md" },
  { "Sew" = "sew.md" },
  { "Arrange" = "arrange.md" },
  { "Simulate" = "simulate.md" },
  { "Library" = "library.md" },
  { "FAQ" = "faq.md" },
  { "For developers" = "https://github.com/Artbyo3/DEVIL-DESIGNER" },
]

[project.extra]
version = "v0.11.0"

[project.theme]
language = "en"
custom_dir = "overrides"
favicon = "assets/favicon.svg"
features = [
  "content.code.copy",
  "navigation.instant",
  "navigation.instant.prefetch",
  "navigation.sections",
  "search.highlight",
]

[project.theme.palette]
scheme = "slate"

[project.markdown_extensions]
abbr = {}
admonition = {}
attr_list = {}
def_list = {}
footnotes = {}
md_in_html = {}
toc.permalink = true
pymdownx.arithmatex.generic = true
pymdownx.betterem = {}
pymdownx.caret = {}
pymdownx.details = {}
pymdownx.highlight.anchor_linenums = true
pymdownx.highlight.line_spans = "__span"
pymdownx.highlight.pygments_lang_class = true
pymdownx.inlinehilite = {}
pymdownx.keys = {}
pymdownx.magiclink = {}
pymdownx.mark = {}
pymdownx.smartsymbols = {}
pymdownx.superfences.custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
]
pymdownx.tabbed.alternate_style = true
pymdownx.tabbed.combine_header_slug = true
pymdownx.tasklist.custom_checkbox = true
pymdownx.tilde = {}
