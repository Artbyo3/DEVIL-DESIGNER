name: Source checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Geometry, editing, sewing, and layout tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Compile add-on source
        run: python -m compileall -q devil_designer
      - name: Build extension archive
        run: python tools/build.py
      - name: Check public source and archive
        run: python tools/check_public.py
